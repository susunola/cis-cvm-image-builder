[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohbs-image"
# Single source of truth: ohbs_image/_logging.py VERSION (read via AST, no import).
dynamic = ["version"]
description = "ohbs-hardened golden image builder for Tencent Cloud — config-driven CLI, 12 OS profiles, bundled ohbs-os engine"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "ohbs-image contributors"}]
requires-python = ">=3.11"
keywords = ["cis", "hardening", "tencent-cloud", "packer", "ansible", "golden-image", "devops", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Installation/Setup",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/susunola/ohbs-image"
Repository = "https://github.com/susunola/ohbs-image.git"
Issues = "https://github.com/susunola/ohbs-image/issues"

[project.scripts]
ohbs-image = "ohbs_image:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1",
    "ruff>=0.8",
    "tomli_w>=1",
    "pywinrm>=0.4",
]

[tool.setuptools]
packages = ["ohbs_image"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ohbs_image._logging.VERSION"}

[tool.setuptools.package-data]
ohbs_image = ["py.typed", "roles/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
# tests/ and the vendored ohbs-os engine (roles/) are not part of the CLI type surface.
exclude = ["tests/", "ohbs_image/roles/"]

[tool.ruff]
target-version = "py311"
line-length = 110
# The bundled ohbs-os engine under ohbs_image/roles/ is vendored verbatim — do not lint it.
extend-exclude = ["ohbs_image/roles"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
