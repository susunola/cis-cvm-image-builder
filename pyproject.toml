[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciscvm"
# Single source of truth: ciscvm/__init__.py VERSION (read via AST, no import).
dynamic = ["version"]
description = "CIS-hardened golden image builder for Tencent Cloud — config-driven CLI, 12 OS profiles, bundled cis-os engine"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "ciscvm contributors"}]
requires-python = ">=3.9"
keywords = ["cis", "hardening", "tencent-cloud", "packer", "ansible", "golden-image", "devops", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Installation/Setup",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/susunola/cis-image"
Repository = "https://github.com/susunola/cis-image.git"
Issues = "https://github.com/susunola/cis-image/issues"

[project.scripts]
cis-image = "ciscvm:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1",
    "ruff>=0.8",
    "tomli_w>=1",
    "pywinrm>=0.4",
]

[tool.setuptools]
packages = ["ciscvm"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ciscvm.VERSION"}

[tool.setuptools.package-data]
ciscvm = ["py.typed", "roles/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
# tests/ and the vendored cis-os engine (roles/) are not part of the CLI type surface.
exclude = ["tests/", "ciscvm/roles/"]

[tool.ruff]
target-version = "py311"
line-length = 110
# The bundled cis-os engine under ciscvm/roles/ is vendored verbatim — do not lint it.
extend-exclude = ["ciscvm/roles"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
