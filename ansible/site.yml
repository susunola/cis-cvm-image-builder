---
- hosts: localhost
  connection: local
  become: true
  vars:
    # ---- CIS 等级 ----
    ubuntu22cis_level_1: true
    ubuntu22cis_level_2: false

    # ---- 云环境例外（务必保留，否则会把自己锁死 / 破坏云能力）----
    ubuntu22cis_ssh_keys: true      # 保留 SSH 公钥登录，不强制 password-only
    # 不启用会破坏 cloud-init / IMDS 的控制项（保持角色默认）
    # GRUB 引导密码默认关闭；由 packer 传 grub_user_pass= 规避角色已知 bug

    # ---- build 期审计 gate ----
    run_audit: true
    setup_audit: true
    audit_only: false
    get_audit_binary_method: "download"

  roles:
    - ansible-lockdown.ubuntu22_cis

# 注意：不同 CIS 版本角色变量名略有差异，以角色 defaults/main.yml 为准；
# 上面为示意。Level 2 还需额外分区（/var /var/tmp /var/log /var/log/audit /home）。
