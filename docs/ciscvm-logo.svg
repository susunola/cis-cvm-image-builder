<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="layer-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006EFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#006EFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="layer-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0080FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0080FF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="layer-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0099FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0099FF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Icon: Shield + Layers -->
  <g transform="translate(40, 30)">
    <!-- Shield outline -->
    <path d="M100 0 L170 18 L170 80 Q170 140 100 170 Q30 140 30 80 L30 18 Z"
          fill="url(#shield-grad)" opacity="0.12"/>
    <path d="M100 0 L170 18 L170 80 Q170 140 100 170 Q30 140 30 80 L30 18 Z"
          stroke="url(#shield-grad)" stroke-width="3.5" fill="none"
          stroke-linejoin="round"/>

    <!-- Layer 3 (bottom) -->
    <rect x="52" y="118" width="96" height="32" rx="4"
          fill="url(#layer-3)" stroke="#006EFF" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Layer 2 (middle) -->
    <rect x="52" y="95" width="96" height="30" rx="4"
          fill="url(#layer-2)" stroke="#006EFF" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Layer 1 (top, most prominent) -->
    <rect x="52" y="72" width="96" height="30" rx="4"
          fill="url(#layer-1)" stroke="#006EFF" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Layer top highlight bar -->
    <rect x="58" y="78" width="84" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="58" y="84" width="50" height="2" rx="1" fill="white" opacity="0.3"/>

    <!-- Checkmark (verified / compliant) -->
    <path d="M82 45 L92 56 L118 30"
          stroke="url(#shield-grad)" stroke-width="4.5" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark area -->
  <g transform="translate(230, 82)">
    <!-- SecX Series brand line (top) -->
    <text x="0" y="-26" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="13" font-weight="600" letter-spacing="5" fill="#006EFF">
      SECX SERIES
    </text>

    <!-- Main wordmark: ciscvm -->
    <text x="0" y="14" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="56" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#1A1A2E">cis</tspan><tspan fill="#006EFF">cvm</tspan>
    </text>

    <!-- Subtitle: CIS-hardened Image Builder -->
    <text x="2" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="14" font-weight="400" letter-spacing="3" fill="#6B7280">
      CIS-HARDENED IMAGE BUILDER
    </text>
  </g>
</svg>
