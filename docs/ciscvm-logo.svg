<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="arc" x1="80" y1="155" x2="220" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0090E0"/>
      <stop offset="100%" stop-color="#006EFF"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#006EFF"/>
    </linearGradient>
  </defs>

  <!-- Arc icon (left) -->
  <g transform="translate(60, 50)">
    <!-- Outer arc (thickest) -->
    <path d="M0 50 Q0 0 40 -20 Q80 -40 120 -20 Q160 0 160 50"
          stroke="url(#arc)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Middle arc -->
    <path d="M8 42 Q8 6 42 -12 Q78 -30 118 -12 Q152 6 152 42"
          stroke="#0090E0" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.65"/>
    <!-- Inner arc (thinnest) -->
    <path d="M16 34 Q16 12 44 -4 Q76 -22 116 -4 Q144 12 144 34"
          stroke="#00B4D8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Source node -->
    <circle cx="0" cy="50" r="6" fill="#00B4D8"/>
    <!-- Target node -->
    <circle cx="160" cy="50" r="6" fill="#006EFF"/>
  </g>

  <!-- Text block (right) -->
  <g transform="translate(260, 0)">
    <!-- SECX SERIES tag (top) -->
    <text x="0" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" font-weight="500" letter-spacing="5" fill="#6B7C95">
      SECX SERIES
    </text>

    <!-- Main wordmark -->
    <text x="0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="64" font-weight="700" letter-spacing="-2" fill="url(#wordmark)">
      ciscvm
    </text>

    <!-- Subtitle -->
    <text x="2" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="400" letter-spacing="4" fill="#6B7C95">
      CIS-HARDENED IMAGE BUILDER
    </text>
  </g>
</svg>
