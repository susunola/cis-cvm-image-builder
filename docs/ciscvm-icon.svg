<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="arc-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1A33"/>
      <stop offset="100%" stop-color="#04101F"/>
    </linearGradient>
    <linearGradient id="arc-line" x1="30" y1="145" x2="170" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0090E0"/>
      <stop offset="100%" stop-color="#006EFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#arc-bg)"/>

  <!-- Subtle glow behind arc -->
  <ellipse cx="100" cy="145" rx="80" ry="20" fill="#006EFF" opacity="0.12"/>

  <!-- Outer arc (thickest) -->
  <path d="M30 145 Q30 60 100 30 Q170 60 170 145"
        stroke="url(#arc-line)" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Middle arc -->
  <path d="M44 135 Q44 70 100 44 Q156 70 156 135"
        stroke="#0090E0" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Inner arc -->
  <path d="M58 125 Q58 82 100 58 Q142 82 142 125"
        stroke="#00B4D8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Source node (left endpoint) -->
  <circle cx="30" cy="145" r="9" fill="#00B4D8"/>
  <circle cx="30" cy="145" r="4" fill="#E8F4FD"/>

  <!-- Target node (right endpoint) -->
  <circle cx="170" cy="145" r="9" fill="#006EFF"/>
  <circle cx="170" cy="145" r="4" fill="#E8F4FD"/>
</svg>
