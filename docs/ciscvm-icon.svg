<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="layer-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006EFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#006EFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="layer-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0080FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0080FF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="layer-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0099FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0099FF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="32" fill="#0A0E27"/>

  <g transform="translate(25, 18)">
    <!-- Shield glow -->
    <path d="M85 -2 L155 16 L155 78 Q155 138 85 168 Q15 138 15 78 L15 16 Z"
          fill="url(#shield-grad)" opacity="0.18"/>
    <path d="M85 -2 L155 16 L155 78 Q155 138 85 168 Q15 138 15 78 L15 16 Z"
          stroke="url(#shield-grad)" stroke-width="3" fill="none"
          stroke-linejoin="round"/>

    <!-- Layer 3 -->
    <rect x="42" y="115" width="86" height="33" rx="4"
          fill="url(#layer-3)" stroke="#006EFF" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Layer 2 -->
    <rect x="42" y="90" width="86" height="33" rx="4"
          fill="url(#layer-2)" stroke="#006EFF" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Layer 1 (top) -->
    <rect x="42" y="65" width="86" height="33" rx="4"
          fill="url(#layer-1)" stroke="#006EFF" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Highlight bars -->
    <rect x="50" y="72" width="70" height="4" rx="2" fill="white" opacity="0.55"/>
    <rect x="50" y="79" width="40" height="2.5" rx="1.25" fill="white" opacity="0.25"/>

    <!-- Checkmark -->
    <path d="M70 40 L80 51 L100 28"
          stroke="url(#shield-grad)" stroke-width="4" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>
</svg>
