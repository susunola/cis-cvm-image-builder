---
- name: Load the remediation guidance and section titles (control node, once)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/files/{{ item.file }}"
    name: "{{ item.name }}"
  loop:
    - { file: "{{ cis_guidance_file }}", name: cis_guidance }
    - { file: "{{ cis_sections_file }}", name: cis_sections }
  loop_control:
    label: "{{ item.file }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: cis_report_html or cis_report_json or cis_report_csv

- name: Ensure the report directory exists
  ansible.builtin.file:
    path: "{{ cis_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false

- name: Freeze the run timestamp
  ansible.builtin.set_fact:
    cis_run_stamp: "{{ now(fmt='%Y%m%d-%H%M%S') }}"
    cis_run_human: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"
  run_once: true

- name: Record fleet size for the multi-host banner
  ansible.builtin.set_fact:
    cis_fleet_size: "{{ ansible_play_hosts | length }}"
  run_once: true

- name: Build the host identity block
  ansible.builtin.set_fact:
    cis_host: >-
      {{ {
        'inventory_name': inventory_hostname,
        'hostname': ansible_facts.hostname | default(cis_result.host.hostname) | default(inventory_hostname, true),
        'fqdn': ansible_facts.fqdn | default(cis_result.host.fqdn) | default('', true),
        'ipv4': ansible_facts.default_ipv4.address | default(cis_result.host.default_ipv4) | default('', true),
        'mac': ansible_facts.default_ipv4.macaddress | default(cis_result.host.default_mac) | default('', true),
        'interface': ansible_facts.default_ipv4.interface | default(cis_result.host.default_interface) | default('', true),
        'all_ipv4': (cis_result.host.ipv4 | default([])) | union(ansible_facts.all_ipv4_addresses | default([])),
        'all_ipv6': cis_result.host.ipv6 | default([]),
        'macs': cis_result.host.mac | default([]),
        'interfaces': cis_result.host.interfaces | default({}),
        'os': cis_result.host.os | default(ansible_facts.distribution | default('') ~ ' ' ~ ansible_facts.distribution_version | default('')) | trim,
        'kernel': cis_result.host.kernel | default(ansible_facts.kernel) | default('', true),
        'arch': ansible_facts.architecture | default(''),
        'virtualization': cis_result.host.virtualization | default(''),
        'uptime_seconds': cis_result.host.uptime_seconds | default(0),
        'ssh_address': ansible_host | default(inventory_hostname)
      } }}

- name: Compose the per-host report file names
  ansible.builtin.set_fact:
    cis_report_slug: "{{ cis_host.hostname | regex_replace('[^A-Za-z0-9._-]', '_') }}-{{ cis_profile }}-{{ cis_mode_effective }}-{{ cis_run_stamp }}"

- name: Write rule IDs for Python-side guidance filtering
  ansible.builtin.copy:
    content: "{{ cis_result.results | map(attribute='id') | list | to_json }}"
    dest: "{{ cis_report_dir }}/_result_ids.json"
  delegate_to: localhost
  become: false
  run_once: true
  when: cis_report_html | bool

- name: Filter guidance JSON to only the rules that actually ran
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import json
      with open('{{ role_path }}/files/{{ cis_guidance_file }}') as f:
          g = json.load(f)
      with open('{{ cis_report_dir }}/_result_ids.json') as f:
          ids = set(json.load(f))
      fg = {k: v for k, v in g.items() if k in ids}
      with open('{{ cis_report_dir }}/_guidance_filtered.json', 'w') as f:
          json.dump(fg, f)
      print(f'Filtered guidance: {len(fg)} of {len(g)} entries')
      "
  delegate_to: localhost
  become: false
  run_once: true
  when: cis_report_html | bool

- name: Load the filtered guidance (no Jinja2 on large dict)
  ansible.builtin.include_vars:
    file: "{{ cis_report_dir }}/_guidance_filtered.json"
    name: cis_guidance
  when: cis_report_html | bool

- name: Write the HTML compliance report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ cis_report_dir }}/{{ cis_report_slug }}.html"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: cis_report_html | bool
  check_mode: false
  changed_when: false

- name: Write the raw engine result
  ansible.builtin.copy:
    content: "{{ cis_result | to_nice_json }}"
    dest: "{{ cis_report_dir }}/{{ cis_report_slug }}.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: cis_report_json | bool
  check_mode: false
  changed_when: false

- name: Write the flat CSV of findings
  ansible.builtin.template:
    src: findings.csv.j2
    dest: "{{ cis_report_dir }}/{{ cis_report_slug }}.csv"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: cis_report_csv | bool
  check_mode: false
  changed_when: false

- name: Write the fleet index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ cis_report_dir }}/index-{{ cis_run_stamp }}.html"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  when: cis_report_index | bool and cis_report_html | bool
  check_mode: false
  changed_when: false

- name: Report location
  ansible.builtin.debug:
    msg: "{{ cis_report_dir }}/{{ cis_report_slug }}.html"
  when: cis_report_html | bool
