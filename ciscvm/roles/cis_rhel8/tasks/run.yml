---
- name: Determine effective mode
  ansible.builtin.set_fact:
    cis_mode_effective: "{{ 'scan' if ansible_check_mode and cis_mode == 'apply' else cis_mode }}"

- name: Create working directory
  ansible.builtin.tempfile:
    state: directory
    prefix: "cis-{{ cis_os_key }}-"
    suffix: ""
  register: _cis_tmp

- name: Ship engine and rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _cis_tmp.path }}/{{ item }}"
    mode: "0644"
  loop:
    - "{{ cis_engine_file }}"
    - "{{ cis_rules_file }}"

- name: Ensure engine is executable
  ansible.builtin.file:
    path: "{{ _cis_tmp.path }}/{{ cis_engine_file }}"
    mode: "0755"

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ cis_backup_dir }}"
    state: directory
    mode: "0700"
  when: cis_mode == 'apply'

- name: Assemble engine command
  ansible.builtin.set_fact:
    _cmd: >-
      {{ cis_python_real }} {{ _cis_tmp.path }}/{{ cis_engine_file }}
      --catalog {{ _cis_tmp.path }}/{{ cis_rules_file }}
      --mode {{ cis_mode_effective }}
      --profile {{ cis_profile }}
      --platform {{ cis_platform }}
      {% if cis_include | length > 0 %}--include {{ cis_include | join(',') }}{% endif %}
      {% if cis_exclude | length > 0 %}--exclude {{ cis_exclude | join(',') }}{% endif %}
      {% if cis_sections | length > 0 %}--sections {{ cis_sections | join(',') }}{% endif %}
      {% if cis_families | length > 0 %}--families {{ cis_families | join(',') }}{% endif %}
      {% if cis_mode == 'apply' %}--backup-dir {{ cis_backup_dir }}{% endif %}
      {% if cis_allow_disruptive %}--allow-disruptive{% endif %}
      --benchmark "{{ cis_benchmark_name }} {{ cis_benchmark_version }}"
      --out {{ _cis_tmp.path }}/result.json

- name: Run benchmark
  ansible.builtin.command: "{{ _cmd }}"
  register: _cis_run
  changed_when: false
  timeout: "{{ cis_engine_timeout }}"
  environment:
    LC_ALL: C

- name: Slurp result
  ansible.builtin.slurp:
    src: "{{ _cis_tmp.path }}/result.json"
  register: _cis_result_raw

- name: Parse result
  ansible.builtin.set_fact:
    cis_result: "{{ _cis_result_raw.content | b64decode | from_json }}"

- name: Clean up temp directory
  ansible.builtin.file:
    path: "{{ _cis_tmp.path }}"
    state: absent
  when: not (cis_keep_remote_artifacts | default(false))

- name: Remediation summary
  ansible.builtin.debug:
    msg:
      - "CIS scan complete: {{ cis_result.summary.all.total }} rules"
      - "Pass: {{ cis_result.summary.all.pass }} / Fail: {{ cis_result.summary.all.fail }}"
      - "Score: {{ cis_result.score }}%"
  when: cis_result.summary.all.assessed | default(0) > 0
