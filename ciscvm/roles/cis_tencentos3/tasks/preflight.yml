---
- name: Validate cis_mode
  ansible.builtin.assert:
    that: cis_mode in ['scan', 'apply']
    fail_msg: >-
      cis_mode must be 'scan' or 'apply' (got '{{ cis_mode }}').
      Example: ansible-playbook site.yml -e cis_mode=apply
    quiet: true

- name: Validate cis_profile
  ansible.builtin.assert:
    that: cis_profile in ['L1', 'L2']
    fail_msg: >-
      cis_profile must be 'L1' or 'L2' (got '{{ cis_profile }}').
      L2 is a superset of L1.
    quiet: true

- name: Validate cis_platform
  ansible.builtin.assert:
    that: cis_platform in ['server', 'workstation', 'all']
    fail_msg: "cis_platform must be server, workstation or all (got '{{ cis_platform }}')"
    quiet: true

- name: Warn when the target does not look like TencentOS Linux 3
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} reports
      '{{ ansible_facts.distribution | default("unknown") }}
      {{ ansible_facts.distribution_major_version | default("?") }}'.
      This role targets TencentOS Linux 3 (EL8 lineage); checks may misreport.
  when:
    - ansible_facts.distribution_major_version is defined
    - ansible_facts.distribution_major_version != '8'
  changed_when: false

- name: Locate a usable Python 3 interpreter on the target
  ansible.builtin.raw: >-
    for p in {{ cis_python }} /usr/bin/python3 /usr/libexec/platform-python
    /usr/local/bin/python3 python3; do
    command -v "$p" >/dev/null 2>&1 && "$p" -c 'import sys;exit(0 if sys.version_info>=(3,6) else 1)'
    >/dev/null 2>&1 && { command -v "$p"; break; }; done
  register: cis_python_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Select the interpreter used by the engine
  ansible.builtin.set_fact:
    cis_python_real: >-
      {{ ((cis_python_probe.stdout_lines | default([]) | map('trim')
           | select('search', 'python') | list) + [cis_python]) | first }}

- name: Require Python 3.6 or newer on the target
  ansible.builtin.assert:
    that: cis_python_real | length > 0
    fail_msg: >-
      No Python 3.6+ interpreter found on {{ inventory_hostname }}.
      Install python3 (dnf install -y python3) or point cis_python at one.
    quiet: true

- name: Confirm privilege escalation is available for apply mode
  ansible.builtin.assert:
    that: ansible_facts.effective_user_id | default(0) | int == 0
    fail_msg: >-
      cis_mode=apply must run as root. Add 'become: true' to the play or
      run with --become.
    quiet: true
  when: cis_mode == 'apply'

- name: Announce the run
  ansible.builtin.debug:
    msg: >-
      {{ cis_benchmark_name }} {{ cis_benchmark_version }} |
      mode={{ cis_mode }} profile={{ cis_profile }} platform={{ cis_platform }}
      disruptive={{ cis_allow_disruptive }} python={{ cis_python_real }}
