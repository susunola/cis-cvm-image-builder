---
# CIS Windows Server Benchmark — role defaults
cis_mode: scan
cis_profile: L1
cis_platform: server
cis_allow_disruptive: false

cis_include: []
cis_exclude: []
cis_sections: []
cis_families: []

cis_report_dir: "{{ playbook_dir }}/reports"
cis_report_html: false
cis_report_json: false
cis_report_csv: false
cis_report_index: true
cis_report_timestamp: "{{ ansible_date_time.iso8601_basic_short | default('run') }}"
cis_report_open_sections: 2
cis_report_embed_remediation: true

cis_powershell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
cis_remote_tmp: C:\Windows\Temp
cis_keep_remote_artifacts: false
cis_engine_timeout: 1800
cis_backup_dir: C:\Windows\Temp\cis-backups
cis_fail_on_findings: false
cis_min_score: 0

cis_benchmark_name: "CIS Microsoft Windows Server 2016 Benchmark"
cis_benchmark_version: "v4.0.0"
cis_org_name: ""
