---
- name: "Build summary"
  ansible.builtin.debug:
    msg: |-
      ═══ CIS Hardening Results ═══
      Mode:      {{ cis_mode_effective }}
      Profile:   {{ cis_profile }}
      Total:     {{ cis_result.summary.all.total }}
      Passed:    {{ cis_result.summary.all.pass }}
      Failed:    {{ cis_result.summary.all.fail }}
      Error:     {{ cis_result.summary.all.error }}
      Manual:    {{ cis_result.summary.all.manual }}
      N/A:       {{ cis_result.summary.all.notapplicable }}
      Score:     {{ cis_result.summary.all.score }}%
      {%- if cis_mode_effective == 'apply' %}
      Applied:   {{ cis_result.summary.all.applied }}
      Pending:   {{ cis_result.summary.all.applied_pending }}
      {%- endif %}

- name: "List failed rules"
  ansible.builtin.debug:
    msg: |-
      {%- for r in cis_result.results %}
      {%- if r.status in ['fail', 'error'] or r.apply_status == 'failed' %}
      ✗ {{ r.id }} | {{ r.title }}
        {{ (r.apply_detail or r.detail or '(no detail)') | trim | regex_replace('\n', '\n        ') }}
      {%- endif %}
      {%- endfor %}
  when: cis_result.summary.all.fail | int > 0 or cis_result.summary.all.error | int > 0
