name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff (lint)
        run: ruff check cis_image

      - name: Run mypy (type-check)
        run: mypy cis_image --ignore-missing-imports

      # Version single-source guard: cis_image/_logging.py VERSION must equal
      # what the installed CLI reports (rebuild.sh relies on the same check).
      - name: Verify version single-source
        run: |
          CODE_VERSION=$(grep -m1 '^VERSION = ' cis_image/_logging.py | sed 's/^VERSION = "//;s/"$//')
          BIN_VERSION=$(cis-image --version | awk '{print $2}')
          echo "code version: $CODE_VERSION | binary version: $BIN_VERSION"
          test "$CODE_VERSION" = "$BIN_VERSION"

      # README freshness guard: scripts/check_readme.py verifies every
      # subcommand the CLI registers and every OS profile is documented in
      # README.md. Adding/removing either without updating the docs fails CI,
      # so the README can't silently drift out of date.
      - name: Verify README documents every subcommand and profile
        run: python3 scripts/check_readme.py

      - name: Run tests
        run: pytest -v --tb=short
